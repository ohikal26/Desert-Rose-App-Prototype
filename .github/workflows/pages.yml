# Builds the prototype and publishes it to GitHub Pages.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Publish prototype

on:
  push:
    branches: [main, claude/new-session-dq0uh1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The repository's Pages setting also runs GitHub's automatic "pages build and deployment"
      # on every push, which publishes the unbuilt source (a blank page). Wait so this
      # deploy always lands last. Permanent fix: Settings → Pages → Source: "GitHub Actions".
      - run: sleep 90
      - id: deployment
        uses: actions/deploy-pages@v4
